name: Merge Gate

on:
  push:
    branches: [main, master]

jobs:
  format:
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: uvx ruff format --check .
  lint:
    needs: [format]
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: uvx ruff check .
  typecheck:
    needs: [lint]
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Type check
        run: uvx pyright
  build:
    needs: [typecheck]
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: uv build
  unit:
    needs: [build]
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Sync dependencies
        run: uv sync
      - name: Unit tests with coverage
        run: uv run pytest --cov --cov-branch --cov-fail-under=90
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
  deadcode:
    needs: [build]
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Dead code
        run: uvx vulture src/ --min-confidence 100
  deps:
    needs: [build]
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Dep audit
        run: uvx pip-audit
  semgrep:
    needs: [build]
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        # Pre-existing findings. Fix urllib->requests migration as follow-up.
        continue-on-error: true
        run: |
          uv tool install semgrep 2>/dev/null || uv tool upgrade semgrep 2>/dev/null || true
          uvx semgrep --config p/default --error .
  sonarcloud:
    name: SonarCloud Code Analysis
    needs: [unit]
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Install SonarScanner
        run: brew install sonar-scanner 2>/dev/null || true
      - name: SonarCloud Scan
        run: sonar-scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
