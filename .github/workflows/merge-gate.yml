name: Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  quality-gate:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Clone AIServices
        uses: actions/checkout@v4
        with:
          repository: Jonathangadeaharder/AIServices
          path: aiservices
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Ruff format check
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Pyright type check
        run: uv run pyright src/

      - name: Run tests with coverage
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -q --cov=showrunner --cov-branch --cov-report=term-missing --cov-fail-under=90

      - name: Coverage XML (Python 3.11 only)
        if: matrix.python-version == '3.11'
        run: uv run pytest tests/ -q --cov=showrunner --cov-branch --cov-report=xml:coverage.xml

      - name: Mutation testing (Python 3.11 only)
        if: matrix.python-version == '3.11'
        run: uv run mutmut run

      - name: Validate episode JSONs
        run: uv run --python ${{ matrix.python-version }} python -m showrunner.validator episode_01.json episode_02.json

      - name: Generate beat plan
        run: uv run --python ${{ matrix.python-version }} showrunner plan episode_01.json

  sonarcloud:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone AIServices
        uses: actions/checkout@v4
        with:
          repository: Jonathangadeaharder/AIServices
          path: aiservices
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage XML
        run: uv run pytest tests/ -q --cov=showrunner --cov-branch --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.1.0
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
