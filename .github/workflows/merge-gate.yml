name: Merge Gate

on:
  push:
    branches: [main, master]

jobs:
  format:
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: uvx ruff format --check .
  lint:
    needs: [format]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: uvx ruff check .
  typecheck:
    needs: [lint]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Type check
        run: uvx pyright
  build:
    needs: [typecheck]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: uv build
  unit:
    needs: [build]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Sync dependencies
        # mlx/mlx-metal only have arm64 macOS wheels; runner is x86_64.
        run: uv sync --no-install-package mlx --no-install-package mlx-metal
      - name: Unit tests with coverage
        run: uv run --no-sync pytest --cov --cov-branch --cov-fail-under=90
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
  deadcode:
    needs: [build]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Dead code
        run: uvx vulture src/ --min-confidence 80
  deps:
    needs: [build]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Dep audit
        run: uvx pip-audit
  semgrep:
    runs-on: ubuntu-latest
    name: Semgrep SAST
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          config: .semgrep.yml
  sonarcloud:
    name: SonarCloud Code Analysis
    needs: [unit]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Install SonarScanner
        run: brew install sonar-scanner 2>/dev/null || true
      - name: SonarCloud Scan
        run: sonar-scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
