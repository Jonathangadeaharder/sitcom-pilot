name: Merge Gate

on:
  push:
    branches: [main, master]

jobs:
  format:
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: uvx ruff format --check .
  lint:
    needs: [format]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: uvx ruff check .
  typecheck:
    needs: [lint]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Type check
        run: uvx pyright
  build:
    needs: [typecheck]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: uv build
  unit:
    needs: [build]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Sync dependencies
        run: uv sync
      - name: Unit tests with coverage
        run: uv run pytest --cov --cov-branch --cov-fail-under=90
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
  deadcode:
    needs: [build]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Dead code
        run: uvx vulture src/ --min-confidence 80
  deps:
    needs: [build]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Dep audit
        run: uvx pip-audit
  semgrep:
    needs: [build]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        # Pre-existing findings. Fix urllib->requests migration as follow-up.
        continue-on-error: true
        run: uvx semgrep scan --config p/default --metrics=off
  gui-lint:
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@9
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Generate SvelteKit types
        run: pnpm exec svelte-kit sync
      - name: Svelte check
        run: pnpm exec svelte-check
      - name: Rust lint (clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  gui-build:
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@9
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm exec vite build
      - name: Build Rust backend (check only)
        run: cargo check --manifest-path src-tauri/Cargo.toml

  sonarcloud:
    name: SonarCloud Code Analysis
    needs: [unit]
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Install SonarScanner
        run: brew install sonar-scanner 2>/dev/null || true
      - name: SonarCloud Scan
        run: sonar-scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
