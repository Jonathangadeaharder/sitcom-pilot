name: PR Gate

on:
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"

jobs:
  format:
    name: Format check
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Clone AIServices
        uses: actions/checkout@v4
        with:
          repository: Jonathangadeaharder/AIServices
          path: aiservices
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff format check
        run: uv run ruff format --check .

  lint:
    name: Lint (ruff)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Clone AIServices
        uses: actions/checkout@v4
        with:
          repository: Jonathangadeaharder/AIServices
          path: aiservices
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

  typecheck:
    name: Type check (pyright)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Clone AIServices
        uses: actions/checkout@v4
        with:
          repository: Jonathangadeaharder/AIServices
          path: aiservices
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Pyright type check
        run: uv run pyright src/

  build:
    name: Build check
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Clone AIServices
        uses: actions/checkout@v4
        with:
          repository: Jonathangadeaharder/AIServices
          path: aiservices
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Build package
        run: uv build

  unit:
    name: Unit tests + coverage
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Clone AIServices
        uses: actions/checkout@v4
        with:
          repository: Jonathangadeaharder/AIServices
          path: aiservices
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage
        run: uv run pytest tests/ -q --cov=showrunner --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90

      - name: Validate episode JSONs
        run: uv run python -m showrunner.validator episode_01.json episode_02.json

      - name: Generate beat plan
        run: uv run showrunner plan episode_01.json

  mutation:
    name: Mutation testing
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Clone AIServices
        uses: actions/checkout@v4
        with:
          repository: Jonathangadeaharder/AIServices
          path: aiservices
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Mutation testing
        run: uv run mutmut run

  deadcode:
    name: Dead code (vulture)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install vulture
        run: uv tool install vulture

      - name: Dead code analysis
        run: uvx vulture src/ --min-confidence 80

  deps:
    name: Dependency audit
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Clone AIServices
        uses: actions/checkout@v4
        with:
          repository: Jonathangadeaharder/AIServices
          path: aiservices
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Check dependencies
        run: uv run pip-audit || echo "pip-audit not available — skipping"

  semgrep:
    name: Semgrep SAST
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install semgrep
        run: uv tool install semgrep

      - name: Semgrep scan
        run: uvx semgrep --config=auto --config=.semgrep.yml --error .

  required-checks:
    name: Required Checks (PR)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    needs:
      - format
      - lint
      - typecheck
      - build
      - unit
      - mutation
      - deadcode
      - deps
      - semgrep
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Verify all jobs passed
        run: |
          RESULT=0
          for job in format lint typecheck build unit mutation deadcode deps semgrep; do
            status="${{ needs[job].result }}"
            if [ "$status" != "success" ] && [ "$status" != "skipped" ]; then
              echo "Job '$job' failed with status: $status"
              RESULT=1
            fi
          done
          if [ "$RESULT" -ne 0 ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
