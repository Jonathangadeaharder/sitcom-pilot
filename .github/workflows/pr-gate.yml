name: PR Gate

on:
  pull_request:
    branches: [main, master]

jobs:
  format:
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: uvx ruff format --check .

  lint:
    needs: [format]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: uvx ruff check .

  typecheck:
    needs: [lint]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Type check
        run: uvx pyright

  build:
    needs: [typecheck]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: uv build

  unit:
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests with coverage
        run: uv run pytest --cov --cov-branch --cov-fail-under=90

  mutation:
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: src/**/*.py
          separator: ','
      - name: Mutation test
        if: steps.changed-files.outputs.any_changed == 'true'
        run: uv run mutmut run --paths-to-mutate ${{ steps.changed-files.outputs.all_changed_files }}

  deadcode:
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Dead code
        run: uvx vulture src/

  deps:
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Dep audit
        run: uvx pip-audit

  semgrep:
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default

  structure:
    name: Repository Structure
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build structurelint
        run: |
          git clone --depth 1 https://github.com/Jonathangadeaharder/structurelint.git /tmp/structurelint
          cd /tmp/structurelint && go build -o /usr/local/bin/structurelint ./cmd/structurelint
      - name: Run structurelint
        run: structurelint .
      - name: Cleanup structurelint build
        if: always()
        run: rm -rf /tmp/structurelint

  pytest-lint:
    name: Test Quality (pytest)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: Jonathangadeaharder/pytest-linter@v1

  required-checks:
    name: Required Checks (PR)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    needs: [format, lint, typecheck, build, unit, mutation, deadcode, deps, semgrep, structure, pytest-lint]
    if: always()
    steps:
      - name: Verify all checks passed
        shell: bash
        run: |
          for JOB in ${{ join(needs.*.result, ' ') }}; do
            if [ "$JOB" != "success" ] && [ "$JOB" != "skipped" ]; then
              echo "❌ Job failed: $JOB"
              exit 1
            fi
          done
          echo "✅ All checks passed"
