name: PR Gate

on:
  pull_request:
    branches: [main, master]

jobs:
  format:
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Format check
        run: uvx ruff format --check .

  lint:
    needs: [format]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: uvx ruff check .

  typecheck:
    needs: [lint]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Type check
        run: uvx pyright

  build:
    needs: [typecheck]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: uv build

  unit:
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Sync dependencies
        # mlx/mlx-metal only have arm64 macOS wheels; runner is x86_64.
        run: uv sync --no-install-package mlx --no-install-package mlx-metal
      - name: Unit tests with coverage
        run: uv run pytest --cov --cov-branch --cov-fail-under=90
        continue-on-error: true

  mutation:
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: src/**/*.py
          separator: ','
      - name: Mutation test
        if: steps.changed-files.outputs.any_changed == 'true'
        run: uv run mutmut run ${{ steps.changed-files.outputs.all_changed_files }}
        continue-on-error: true

  deadcode:
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Dead code
        run: uvx vulture src/ --min-confidence 80

  deps:
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Dep audit
        run: uvx pip-audit

  semgrep:
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: uvx semgrep scan --config p/default --metrics=off

  structure:
    name: Repository Structure
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build structurelint
        run: |
          git clone --depth 1 https://github.com/Jonathangadeaharder/structurelint.git /tmp/structurelint
          cd /tmp/structurelint && go build -o /usr/local/bin/structurelint ./cmd/structurelint
      - name: Run structurelint
        run: structurelint .
      - name: Cleanup structurelint build
        if: always()
        run: rm -rf /tmp/structurelint

  pytest-lint:
    name: Test Quality (pytest)
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    needs: [build]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest-linter
        run: |
          export PATH="/Users/jonathangadeaharder/.cargo/bin:$PATH"
          cargo install pytest-linter --git https://github.com/VidiomTM/pytest-linter --locked 2>/dev/null || true
      - name: Run pytest-linter
        run: |
          export PATH="/Users/jonathangadeaharder/.cargo/bin:$PATH"
          pytest-linter check tests/

  gui-lint:
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@9
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Generate SvelteKit types
        run: pnpm exec svelte-kit sync
      - name: Svelte check
        run: pnpm exec svelte-check
      - name: Rust lint (clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  gui-build:
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm@9
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm exec vite build
      - name: Build Rust backend (check only)
        run: cargo check --manifest-path src-tauri/Cargo.toml

  required-checks:
    name: Required Checks (PR)
    runs-on: ["self-hosted", "macOS", "ARM64", "VidiomTM"]
    needs: [format, lint, typecheck, build, unit, mutation, deadcode, deps, semgrep, structure, pytest-lint, gui-lint, gui-build]
    if: always()
    steps:
      - name: Verify all checks passed
        shell: bash
        run: |
          for JOB in ${{ join(needs.*.result, ' ') }}; do
            if [ "$JOB" != "success" ] && [ "$JOB" != "skipped" ]; then
              echo "❌ Job failed: $JOB"
              exit 1
            fi
          done
          echo "✅ All checks passed"
