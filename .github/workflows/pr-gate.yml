name: PR Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Clone AIServices
        uses: actions/checkout@v4
        with:
          repository: Jonathangadeaharder/AIServices
          path: aiservices
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Ruff format check
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Pyright type check
        run: uv run pyright src/

      - name: Run tests with coverage
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -q --cov=showrunner --cov-branch --cov-report=term-missing --cov-fail-under=90

      - name: Coverage XML (Python 3.11 only)
        if: matrix.python-version == '3.11'
        run: uv run pytest tests/ -q --cov=showrunner --cov-branch --cov-report=xml:coverage.xml

      - name: Mutation testing (Python 3.11 only)
        if: matrix.python-version == '3.11'
        run: uv run mutmut run

      - name: Validate episode JSONs
        run: uv run --python ${{ matrix.python-version }} python -m showrunner.validator episode_01.json episode_02.json

      - name: Generate beat plan
        run: uv run --python ${{ matrix.python-version }} showrunner plan episode_01.json

  required-checks:
    name: Required Checks (PR)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    needs: lint-and-test
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.lint-and-test.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
