name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Clone AIServices
        uses: actions/checkout@v4
        with:
          repository: Jonathangadeaharder/AIServices
          path: aiservices

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Ruff format check
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Run tests with coverage
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -q --cov=sitcom_pilot --cov-report=term-missing

      - name: Validate episode JSONs
        run: uv run --python ${{ matrix.python-version }} python -m sitcom_pilot.validator episode_01.json episode_02.json
