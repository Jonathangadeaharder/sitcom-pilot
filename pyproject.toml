[project]
name = "showrunner"
version = "0.1.0"
description = "Beat-based AI sitcom pilot pipeline (Buffering S01)"
requires-python = ">=3.11"
dependencies = [
    # Data modelling & config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Structured logging
    "structlog>=25.1.0",
    # Episode schema validation
    "jsonschema>=4.21.0",
    # Image processing (continuity checks)
    "pillow>=12.2.0",
    "scikit-image>=0.20.0",
    # Legacy audio pipeline deps
    "ormsgpack>=1.12.2",
    "rich>=15.0.0",
    "typer>=0.24.2",
    # AIServices packages (clean client interfaces)
    "aiservices-core",
    "text2image",
    "image2image",
    "image2video",
    "text2speech",
    "audio2subtitle",
]

[tool.uv.sources]
aiservices-core = { git = "https://github.com/Jonathangadeaharder/AIServices.git", subdirectory = "packages/aiservices_core" }
text2image = { git = "https://github.com/Jonathangadeaharder/AIServices.git", subdirectory = "packages/text2image" }
image2image = { git = "https://github.com/Jonathangadeaharder/AIServices.git", subdirectory = "packages/image2image" }
image2video = { git = "https://github.com/Jonathangadeaharder/AIServices.git", subdirectory = "packages/image2video" }
text2speech = { git = "https://github.com/Jonathangadeaharder/AIServices.git", subdirectory = "packages/text2speech" }
audio2subtitle = { git = "https://github.com/Jonathangadeaharder/AIServices.git", subdirectory = "packages/audio2subtitle" }

[dependency-groups]
dev = [
    "mutmut>=3.5.0",
    "pygments<2.19",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pyright>=1.1.400",
    "ruff>=0.15.0",
]

[project.scripts]
showrunner = "showrunner.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=showrunner --cov-branch --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["src/showrunner"]

[tool.coverage.report]
# fail_under enforced by --cov-fail-under=90 in CI workflow commands (pr-gate.yml lines 47, 51)
# Removed from here to prevent mutmut's internal test runs from failing on pre-imported modules

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["legacy/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PL"]
ignore = ["PLC0415", "ARG001", "ARG002", "ARG004", "ARG005", "SIM117", "B904", "B007", "B018", "PLR2004", "PLR0913", "PLW1510", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"legacy/*" = ["E402", "E501", "F841", "I001"]
"tests/*" = ["PLC0415"]
"scripts/*" = ["PLC0415"]
"src/showrunner/aiservices_client.py" = ["PLC0415"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
paths_to_mutate = [
    "src/showrunner/planner.py",
    "src/showrunner/manifest.py",
    "src/showrunner/determinism.py",
]
runner = "uv run pytest -x --no-header -q --no-cov"
tests_dir = ["tests/test_planner.py", "tests/test_manifest.py", "tests/test_determinism.py"]
also_copy = ["src/showrunner", "episode_01.json", "episode_02.json"]
backup = false

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "legacy", "output", "aiservices"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportPrivateUsage = false
reportConstantRedefinition = false
reportUnusedClass = false
reportAny = false
reportMissingImports = false
reportUntypedFunctionDecorator = false
reportMissingTypeArgument = false
reportUntypedBaseClass = false
reportUnnecessaryIsInstance = false

[tool.vulture]
paths = ["src/"]

[tool.hatch.build.targets.wheel]
packages = ["src/showrunner", "src/showrunner_utils", "src/showrunner_tests"]
