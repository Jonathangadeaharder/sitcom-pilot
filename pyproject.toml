[project]
name = "sitcom-pilot"
version = "0.1.0"
description = "Beat-based AI sitcom pilot pipeline (Buffering S01)"
requires-python = ">=3.11"
dependencies = [
    # Data modelling & config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Structured logging
    "structlog>=24.0.0",
    # Episode schema validation
    "jsonschema>=4.21.0",
    # Legacy audio pipeline deps
    "ormsgpack>=1.12.2",
    "rich>=15.0.0",
    "typer>=0.24.2",
]

[project.optional-dependencies]
aiservices = ["aiservices-core"]

[tool.uv]
dev-dependencies = [
    "mutmut>=3.5.0",
    "pygments<2.19",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
aiservices-core = { path = "../AIServices/packages/aiservices_core", editable = true }

[project.scripts]
sitcom-pilot = "sitcom_pilot.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"legacy/*" = ["E402", "I001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
paths_to_mutate = ["src/sitcom_pilot/determinism.py", "src/sitcom_pilot/beat_prompts.py", "src/sitcom_pilot/scene_render.py", "src/sitcom_pilot/cast_manifest.py", "src/sitcom_pilot/continuity.py"]
runner = "uv run pytest tests/ -q --no-header -x"
tests_dir = ["tests/"]

[tool.hatch.build.targets.wheel]
packages = ["src/sitcom_pilot", "src/sitcom_pilot_utils", "src/sitcom_pilot_tests"]
