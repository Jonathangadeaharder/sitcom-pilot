[project]
name = "sitcom-pilot"
version = "0.1.0"
description = "Beat-based AI sitcom pilot pipeline (Buffering S01)"
requires-python = ">=3.11"
dependencies = [
    # Data modelling & config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Structured logging
    "structlog>=24.0.0",
    # Episode schema validation
    "jsonschema>=4.21.0",
    # Legacy audio pipeline deps
    "ormsgpack>=1.12.2",
    "rich>=15.0.0",
    "typer>=0.24.2",
    # AIServices packages (clean client interfaces)
    "text2image",
    "image2image",
    "image2video",
    "text2speech",
    "audio2subtitle",
]

[tool.uv.sources]
text2image = { path = "../AIServices/packages/text2image", editable = true }
image2image = { path = "../AIServices/packages/image2image", editable = true }
image2video = { path = "../AIServices/packages/image2video", editable = true }
text2speech = { path = "../AIServices/packages/text2speech", editable = true }
audio2subtitle = { path = "../AIServices/packages/audio2subtitle", editable = true }

[dependency-groups]
dev = [
    "mutmut>=3.5.0",
    "pillow>=12.2.0",
    "pygments<2.19",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[project.scripts]
sitcom-pilot = "sitcom_pilot.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["legacy/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"legacy/*" = ["E402", "E501", "F841", "I001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mutmut]
paths_to_mutate = ["src/sitcom_pilot/determinism.py", "src/sitcom_pilot/beat_prompts.py", "src/sitcom_pilot/scene_render.py", "src/sitcom_pilot/cast_manifest.py", "src/sitcom_pilot/continuity.py"]
runner = "uv run pytest tests/ -q --no-header -x"
tests_dir = ["tests/"]

[tool.hatch.build.targets.wheel]
packages = ["src/sitcom_pilot", "src/sitcom_pilot_utils", "src/sitcom_pilot_tests"]
